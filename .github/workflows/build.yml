name: build

on: [push, pull_request]

# Everything shipped to users is built here, in public, from a tagged commit.
# Nothing is ever uploaded from a developer machine. See VERIFYING.md for how
# to check a downloaded jar against these runs.
permissions:
  contents: read

jobs:
  # Host-platform build: cargo crates + adapter jar + the no-Minecraft FFI harness test.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: rust
        shell: bash
        run: echo "channel=$(grep '^channel' rust/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build test --stacktrace

  # Release cross-build matrix. On tag pushes, build the trampoline + example
  # cdylibs for all five supported targets; release-package below merges them
  # into the shipped jars. Dev/branch builds still ship host natives only.
  release-natives:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      # A failure on one platform should not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     platform: windows-x64 }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   platform: linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  platform: linux-arm64 }
          # cross-compiled from the arm64 runner; the macos-13 Intel image was retired Dec 2025
          - { os: macos-latest,     target: x86_64-apple-darwin,        platform: macos-x64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,       platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: rust
        shell: bash
        run: echo "channel=$(grep '^channel' rust/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      # --locked forbids any dependency resolution not already in Cargo.lock.
      # The remap rewrites this checkout's absolute path to a fixed string so the
      # runner's directory layout is not baked into the binaries. build.gradle
      # sets the identical flag for local builds, so both sides compile the same
      # way. (cargo's trim-paths would be tidier but is still unstable on 1.96.)
      - name: Build natives
        working-directory: rust
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/flr --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --locked --release --target ${{ matrix.target }} -p fabric-language-rust-native -p example-mod

      # Printed into the public log so each platform's binaries can be checked
      # against the ones that end up in the release jar. find, not a glob: only
      # one of the three extensions exists on any given runner.
      - name: Record native checksums
        working-directory: rust/target/${{ matrix.target }}/release
        shell: bash
        run: find . -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) -exec shasum -a 256 {} +

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: |
            rust/target/${{ matrix.target }}/release/*.dll
            rust/target/${{ matrix.target }}/release/*.so
            rust/target/${{ matrix.target }}/release/*.dylib

  # Release packaging. Stage the cross-compiled natives as
  # <staging>/natives/<platform>/<mapped-lib-name> (cargo already emits the
  # platform-correct file names: <name>.dll / lib<name>.so / lib<name>.dylib),
  # rebuild the jars with -PextraNativesDir so both the adapter jar and the
  # example jar bundle all five platforms, then sign and attach them.
  release-package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-natives
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # record it
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Rust version
        id: rust
        shell: bash
        run: echo "channel=$(grep '^channel' rust/rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download cross-compiled natives
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives-artifacts

      - name: Stage natives as natives/<platform>/<lib>
        run: |
          mkdir -p staging/natives
          for dir in natives-artifacts/natives-*; do
            platform="$(basename "$dir")"
            platform="${platform#natives-}"
            mkdir -p "staging/natives/$platform"
            cp "$dir"/* "staging/natives/$platform/"
          done
          find staging -type f

      - name: Build release jars (all platforms bundled)
        run: ./gradlew build "-PextraNativesDir=$GITHUB_WORKSPACE/staging" --stacktrace

      # What is actually in the jars, printed into the public build log so the
      # log alone shows every file that shipped and its hash.
      - name: List and checksum release artifacts
        run: |
          for jar in build/libs/*.jar example/build/libs/*.jar; do
            echo "=== $jar ==="
            unzip -l "$jar"
          done
          sha256sum build/libs/*.jar example/build/libs/*.jar | tee SHA256SUMS.txt

      # Cryptographic proof, signed by GitHub, binding each jar's digest to this
      # commit and this workflow file. Verified with:
      #   gh attestation verify <jar> --repo Bownlux/Fabric-Language-Rust
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/libs/*.jar
            example/build/libs/*.jar

      - name: Attach jars to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            example/build/libs/*.jar
            SHA256SUMS.txt
